<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณ — toothORteeth</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks {
      display: flex;
      align-items: center;
      min-height: calc(100vh - 6rem);
      min-height: calc(100svh - 6rem);
    }
    .thanks h1 { line-height: 1.4; } /* ตัวอักษรไทยต้องการระยะบรรทัดสูงกว่า */
    @media (max-width: 48rem) {
      .thanks {
        min-height: calc(100vh - 9.5rem);
        min-height: calc(100svh - 9.5rem);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">toothORteeth</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section thanks">
      <div class="container center">
        <h1>ขอบคุณสำหรับการสั่งซื้อ</h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="muted">เราได้รับคำสั่งซื้อของคุณเรียบร้อยแล้ว และจะติดต่อกลับตามช่องทางที่คุณให้ไว้</p>
        <a class="btn btn--accent" href="index.html">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>toothORteeth</span>
      <span>&copy; 2026 toothORteeth สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
