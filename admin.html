<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — toothORteeth</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์ตาราง (เฉพาะหน้านี้) — เส้นบางๆ ไม่มีพื้นสีฉูดฉาด */
    .table-wrap {
      overflow-x: auto; /* มือถือเลื่อนตารางในแนวนอนได้ โดยหน้าเว็บไม่ล้น */
      border: var(--border-faint);
    }

    #ordersTable {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 0.9rem 1.1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: var(--border-faint);
    }

    #ordersTable thead th {
      font-weight: 500;
      color: var(--accent-deep);
      white-space: nowrap;
      background: var(--cream);
      border-bottom: var(--border);
    }

    #ordersTable tbody tr:last-child td { border-bottom: 0; }

    h1 { line-height: 1.4; } /* ตัวอักษรไทยต้องการระยะบรรทัดสูงกว่า */
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">toothORteeth</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section__head">
          <h1>รายการสั่งซื้อ</h1>
          <span class="rule" aria-hidden="true"></span>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <!-- script.js เติมข้อมูลลง tbody -->
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>toothORteeth</span>
      <span>&copy; 2026 toothORteeth สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
